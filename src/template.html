<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>

<body>
    <aside>
        <nav>
            <div id="navigation-header">
                <h1>Projects</h1>
                <button id="sidebar-button" aria-label="Toggle Sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true" focusable="false"
                        width="20" height="20">
                        <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path
                            d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z" />
                    </svg>
                </button>
            </div>
            <button id="add-project" type="button">+ New project</button>
            <div id="projects"></div>
        </nav>
    </aside>
    <div class="resizer" id="resizer"></div>
    <main id="project"></main>
    <dialog id="item-info" class="modal">
        <form method="dialog" class="modal-close-form">
            <button class="modal-close" aria-label="Close">&times;</button>
        </form>
        <h2 id="item-info-title"></h2>
        <dl class="modal-details">
            <dt>Description</dt>
            <dd id="item-info-description"></dd>
            <dt>Priority</dt>
            <dd id="item-info-priority"></dd>
            <dt>Due date</dt>
            <dd id="item-info-due-date"></dd>
            <dt>Project</dt>
            <dd id="item-info-project"></dd>
        </dl>
    </dialog>

    <dialog id="item-edit" class="modal">
        <h2>Edit item</h2>
        <form id="item-edit-form" class="modal-form">
            <label for="edit-item-name">Name</label>
            <input id="edit-item-name" type="text" required>

            <label for="edit-item-description">Description</label>
            <textarea id="edit-item-description" rows="3"></textarea>

            <label for="edit-item-due-date">Due date</label>
            <input id="edit-item-due-date" type="date">

            <label for="edit-item-priority">Priority</label>
            <select id="edit-item-priority"></select>

            <div class="modal-actions">
                <button type="button" id="edit-item-cancel">Cancel</button>
                <button type="submit" id="edit-item-save">Save changes</button>
            </div>
        </form>
    </dialog>
</body>

</html>
