<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
</head>

<body>
    <!--
    THESIS: Tasks are coupons in an airline ticket wallet; finishing one never deletes it, it stamps it VOID. Refuses the category's white rounded-card list on a pastel ground.
    OWN-WORLD: Carrier navy #0D1B3D, jet red #D7262D, stock white #F2F2F0, carbon purple #4B2E83. Hairline-ruled field boxes, tab-caps labels, notched coupon corners, security microdot, red diagonal VOID hatch. Archivo display caps; Courier Prime for every figure.
    STORY: The visitor sees a wallet of issued coupons, reads title, date and priority in fixed fields, and cancels one by stamping it.
    FIRST VIEWPORT: Navy wallet cover left with the wing mark over project tabs. Right: navy sheet-head carrying the project name in white display caps and a red open-count box, then coupons on stock white, ISSUE COUPON at the foot.
    FORM: Jet-Age Ticket Wallet, dealt challenger, chosen over grounded candidate 7; seed c06b7f12.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <aside>
        <div id="brand">
            <svg id="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true"
                focusable="false">
                <path class="mark-box" d="M3 3h26v18.5L21.5 29H3z" />
                <path class="mark-check" d="m9.5 16.5 4.5 4.5L24 10.5" />
            </svg>
            <span id="brand-name">Todo List</span>
        </div>

        <nav>
            <button id="notes-header" class="nav-item" type="button">
                <span class="nav-tab-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                        focusable="false">
                        <path fill-rule="evenodd"
                            d="M5 3h14v18H5V3zm1.7 1.7v14.6h10.6V4.7H6.7zm1.5 3h7.6v1.5H8.2V7.7zm0 3.6h7.6v1.5H8.2v-1.5zm0 3.6h4.6v1.5H8.2v-1.5z" />
                    </svg>
                </span>
                <span class="nav-tab-name">Notes</span>
            </button>

            <div class="nav-section">
                <h2>Projects</h2>
                <button id="add-project" type="button" aria-label="New project" title="New project">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z" />
                    </svg>
                </button>
            </div>

            <div id="projects"></div>
        </nav>
    </aside>
    <main id="project"></main>
    <dialog id="item-info" class="modal">
        <div class="modal-head">
            <h2 id="item-info-title"></h2>
            <form method="dialog" class="modal-close-form">
                <button class="modal-close" type="submit" aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"
                        focusable="false">
                        <path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z" />
                    </svg>
                </button>
            </form>
        </div>
        <dl class="modal-details">
            <dt>Description</dt>
            <dd id="item-info-description"></dd>
            <dt>Priority</dt>
            <dd id="item-info-priority"></dd>
            <dt>Due date</dt>
            <dd id="item-info-due-date"></dd>
            <dt>Project</dt>
            <dd id="item-info-project"></dd>
        </dl>
    </dialog>

    <dialog id="item-edit" class="modal">
        <div class="modal-head">
            <h2>Amend coupon</h2>
        </div>
        <form id="item-edit-form" class="modal-form">
            <label for="edit-item-name">Name</label>
            <input id="edit-item-name" type="text" required>

            <label for="edit-item-description">Description</label>
            <textarea id="edit-item-description" rows="3"></textarea>

            <div class="modal-form-row">
                <div class="modal-form-cell">
                    <label for="edit-item-due-date">Due date</label>
                    <input id="edit-item-due-date" type="date">
                </div>
                <div class="modal-form-cell">
                    <label for="edit-item-priority">Priority</label>
                    <select id="edit-item-priority"></select>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" id="edit-item-cancel">Cancel</button>
                <button type="submit" id="edit-item-save">Save changes</button>
            </div>
        </form>
    </dialog>
</body>

</html>
